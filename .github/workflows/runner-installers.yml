name: Runner installer checks
on:
  push:
    paths: ['build.gradle.kts', 'src/main/kotlin/local/servermanager/GameNetwork.kt', 'src/main/kotlin/local/servermanager/MinecraftQuery.kt', 'sable-bridge/**', 'src/main/kotlin/local/servermanager/QueryEndpoint.kt', 'src/main/kotlin/local/servermanager/Sable*.kt', 'src/test/kotlin/local/servermanager/Sable*Test.kt', 'src/test/kotlin/local/servermanager/QueryEndpointTest.kt', 'packaging/runner/**', 'scripts/test-runner-setup.py', '.github/workflows/runner-installers.yml', 'src/main/kotlin/local/servermanager/DeltaTransfer.kt', 'src/main/kotlin/local/servermanager/RunnerTransfer.kt', 'src/main/kotlin/local/servermanager/RunnerFolders.kt', 'src/main/kotlin/local/servermanager/Mod*.kt', 'src/main/kotlin/local/servermanager/Runner*.kt', 'src/main/kotlin/local/servermanager/TransferBatch.kt', 'src/test/kotlin/local/servermanager/Mod*Test.kt', 'src/test/kotlin/local/servermanager/StopWatchdogTest.kt', 'src/main/kotlin/local/servermanager/StopWatchdog.kt', 'src/test/kotlin/local/servermanager/*TransferTest.kt', 'src/test/kotlin/local/servermanager/Runner*Test.kt', 'src/test/kotlin/local/servermanager/Transfer*Test.kt', 'src/test/kotlin/local/servermanager/RunnerFoldersTest.kt']
  pull_request:
    paths: ['build.gradle.kts', 'src/main/kotlin/local/servermanager/GameNetwork.kt', 'src/main/kotlin/local/servermanager/MinecraftQuery.kt', 'sable-bridge/**', 'src/main/kotlin/local/servermanager/QueryEndpoint.kt', 'src/main/kotlin/local/servermanager/Sable*.kt', 'src/test/kotlin/local/servermanager/Sable*Test.kt', 'src/test/kotlin/local/servermanager/QueryEndpointTest.kt', 'packaging/runner/**', 'scripts/test-runner-setup.py', '.github/workflows/runner-installers.yml', 'src/main/kotlin/local/servermanager/DeltaTransfer.kt', 'src/main/kotlin/local/servermanager/RunnerTransfer.kt', 'src/main/kotlin/local/servermanager/RunnerFolders.kt', 'src/main/kotlin/local/servermanager/Mod*.kt', 'src/main/kotlin/local/servermanager/Runner*.kt', 'src/main/kotlin/local/servermanager/TransferBatch.kt', 'src/test/kotlin/local/servermanager/Mod*Test.kt', 'src/test/kotlin/local/servermanager/StopWatchdogTest.kt', 'src/main/kotlin/local/servermanager/StopWatchdog.kt', 'src/test/kotlin/local/servermanager/*TransferTest.kt', 'src/test/kotlin/local/servermanager/Runner*Test.kt', 'src/test/kotlin/local/servermanager/Transfer*Test.kt', 'src/test/kotlin/local/servermanager/RunnerFoldersTest.kt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-runner-setup.py
      - name: Verify file handoff and recovery
        shell: bash
        run: ./gradlew test --tests local.servermanager.DeltaTransferTest --tests local.servermanager.RunnerTransferTest --tests local.servermanager.RunnerFoldersTest --tests local.servermanager.TransferMeterTest --tests local.servermanager.TransferBatchTest --tests local.servermanager.RunnerUpdateTest --tests local.servermanager.RunnerWorkspaceTest --tests local.servermanager.RemoteForceStopTest --tests local.servermanager.QueryEndpointTest --tests local.servermanager.SableRelayTest --tests local.servermanager.SableRunnerTest --tests local.servermanager.DatagramOutboxTest --tests local.servermanager.ModSearchTest --tests local.servermanager.ModArtifactsTest --tests local.servermanager.StopWatchdogTest --no-daemon
      - name: Verify central runner control permissions
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew test --tests local.servermanager.RunnerRegistryTest --tests local.servermanager.RunnerGatewayTest --tests local.servermanager.FolderImportTest --tests local.servermanager.FileSyncTest --tests local.servermanager.AccountRoleTest --no-daemon
