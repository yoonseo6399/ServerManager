name: Runner installer checks
on:
  push:
    paths: ['build.gradle.kts', 'src/main/kotlin/local/servermanager/network/GameNetwork.kt', 'src/main/kotlin/local/servermanager/server/MinecraftQuery.kt', 'sable-bridge/**', 'src/main/kotlin/local/servermanager/server/QueryEndpoint.kt', 'src/main/kotlin/local/servermanager/**/Sable*.kt', 'src/test/kotlin/local/servermanager/**/Sable*Test.kt', 'src/test/kotlin/local/servermanager/server/QueryEndpointTest.kt', 'packaging/runner/**', 'scripts/test-runner-setup.py', '.github/workflows/runner-installers.yml', 'src/main/kotlin/local/servermanager/server/StartActor.kt', 'src/main/kotlin/local/servermanager/server/ServerExit.kt', 'src/main/kotlin/local/servermanager/server/PowerSaving.kt', 'src/test/kotlin/local/servermanager/server/StartActorTest.kt', 'src/test/kotlin/local/servermanager/server/PowerSavingTest.kt', 'src/main/kotlin/local/servermanager/transfer/VerifiedInventory.kt', 'src/main/kotlin/local/servermanager/transfer/FileInventory.kt', 'src/test/kotlin/local/servermanager/transfer/VerifiedInventoryTest.kt', 'src/main/kotlin/local/servermanager/transfer/DeltaTransfer.kt', 'src/main/kotlin/local/servermanager/runner/RunnerTransfer.kt', 'src/main/kotlin/local/servermanager/runner/RunnerFolders.kt', 'src/main/kotlin/local/servermanager/**/Mod*.kt', 'src/main/kotlin/local/servermanager/**/Runner*.kt', 'src/main/kotlin/local/servermanager/**/Transfer*.kt', 'src/test/kotlin/local/servermanager/**/Mod*Test.kt', 'src/test/kotlin/local/servermanager/server/StopWatchdogTest.kt', 'src/main/kotlin/local/servermanager/server/StopWatchdog.kt', 'src/test/kotlin/local/servermanager/**/*TransferTest.kt', 'src/test/kotlin/local/servermanager/**/Runner*Test.kt', 'src/test/kotlin/local/servermanager/**/Transfer*Test.kt', 'src/test/kotlin/local/servermanager/runner/RunnerFoldersTest.kt']
  pull_request:
    paths: ['build.gradle.kts', 'src/main/kotlin/local/servermanager/network/GameNetwork.kt', 'src/main/kotlin/local/servermanager/server/MinecraftQuery.kt', 'sable-bridge/**', 'src/main/kotlin/local/servermanager/server/QueryEndpoint.kt', 'src/main/kotlin/local/servermanager/**/Sable*.kt', 'src/test/kotlin/local/servermanager/**/Sable*Test.kt', 'src/test/kotlin/local/servermanager/server/QueryEndpointTest.kt', 'packaging/runner/**', 'scripts/test-runner-setup.py', '.github/workflows/runner-installers.yml', 'src/main/kotlin/local/servermanager/server/StartActor.kt', 'src/main/kotlin/local/servermanager/server/ServerExit.kt', 'src/main/kotlin/local/servermanager/server/PowerSaving.kt', 'src/test/kotlin/local/servermanager/server/StartActorTest.kt', 'src/test/kotlin/local/servermanager/server/PowerSavingTest.kt', 'src/main/kotlin/local/servermanager/transfer/VerifiedInventory.kt', 'src/main/kotlin/local/servermanager/transfer/FileInventory.kt', 'src/test/kotlin/local/servermanager/transfer/VerifiedInventoryTest.kt', 'src/main/kotlin/local/servermanager/transfer/DeltaTransfer.kt', 'src/main/kotlin/local/servermanager/runner/RunnerTransfer.kt', 'src/main/kotlin/local/servermanager/runner/RunnerFolders.kt', 'src/main/kotlin/local/servermanager/**/Mod*.kt', 'src/main/kotlin/local/servermanager/**/Runner*.kt', 'src/main/kotlin/local/servermanager/**/Transfer*.kt', 'src/test/kotlin/local/servermanager/**/Mod*Test.kt', 'src/test/kotlin/local/servermanager/server/StopWatchdogTest.kt', 'src/main/kotlin/local/servermanager/server/StopWatchdog.kt', 'src/test/kotlin/local/servermanager/**/*TransferTest.kt', 'src/test/kotlin/local/servermanager/**/Runner*Test.kt', 'src/test/kotlin/local/servermanager/**/Transfer*Test.kt', 'src/test/kotlin/local/servermanager/runner/RunnerFoldersTest.kt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-runner-setup.py
      - name: Prepare pinned official YouTube dependencies
        run: python scripts/prepare-youtube-source.py
      - name: Verify file handoff and recovery
        shell: bash
        run: ./gradlew test --tests local.servermanager.DeltaTransferTest --tests local.servermanager.RunnerReceiptRecoveryTest --tests local.servermanager.VerifiedInventoryTest --tests local.servermanager.RunnerIdleStopTest --tests local.servermanager.StartActorTest --tests local.servermanager.PowerSavingTest --tests local.servermanager.RunnerTransferTest --tests local.servermanager.RunnerFoldersTest --tests local.servermanager.TransferMeterTest --tests local.servermanager.TransferTasksTest --tests local.servermanager.TransferWaitTest --tests local.servermanager.TransferBatchTest --tests local.servermanager.RunnerUpdateTest --tests local.servermanager.RunnerWorkspaceTest --tests local.servermanager.RemoteForceStopTest --tests local.servermanager.QueryEndpointTest --tests local.servermanager.SableRelayTest --tests local.servermanager.SableRunnerTest --tests local.servermanager.DatagramOutboxTest --tests local.servermanager.ModSearchTest --tests local.servermanager.ModArtifactsTest --tests local.servermanager.StopWatchdogTest --no-daemon
      - name: Verify central runner control permissions
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew test --tests local.servermanager.RunnerRegistryTest --tests local.servermanager.RunnerGatewayTest --tests local.servermanager.FolderImportTest --tests local.servermanager.FileSyncTest --tests local.servermanager.AccountRoleTest --no-daemon
