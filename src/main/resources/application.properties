spring.config.import=optional:file:./config/application.properties
server.address=${SERVER_MANAGER_BIND:127.0.0.1}
server.port=${SERVER_MANAGER_PORT:8787}
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=256MB
server.error.include-message=never
server-manager.public-origin=${SERVER_MANAGER_PUBLIC_ORIGIN:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none

spring.task.scheduling.pool.size=3

# Avoid provider visitor identifiers and signed streaming URLs in normal music logs.
logging.level.dev.lavalink.youtube.http.YoutubeAccessTokenTracker=WARN
logging.level.dev.lavalink.youtube.clients.skeleton.StreamingNonMusicClient=ERROR
